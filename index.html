body[data-theme="outdoor"] .header{background:#000;color:#fff}body[data-theme="outdoor"] .identity small,body[data-theme="outdoor"] .demo-badge{color:#fff}body[data-theme="outdoor"] .mark{background:#ffea00;color:#000}body[data-theme="outdoor"] .hero p,body[data-theme="outdoor"] .muted,body[data-theme="outdoor"] .sectionhead p,body[data-theme="outdoor"] label{color:#303030}body[data-theme="outdoor"] .eyebrow{color:#003d7a}body[data-theme="outdoor"] .trialbar,body[data-theme="outdoor"] .subtle,body[data-theme="outdoor"] .sms-sim{background:#fff;border:2px solid #111}body[data-theme="outdoor"] .panel,body[data-theme="outdoor"] .search-board,body[data-theme="outdoor"] .status-card{border:2px solid #111;box-shadow:none}body[data-theme="outdoor"] .mainnav button{color:#111;border:2px solid #333}body[data-theme="outdoor"] .mainnav button.active,body[data-theme="outdoor"] button.primary{background:#003c78;color:#fff;border:2px solid #003c78}body[data-theme="outdoor"] button,body[data-theme="outdoor"] input,body[data-theme="outdoor"] select,body[data-theme="outdoor"] textarea{min-height:48px;font-size:16px;border:2px solid #222}body[data-theme="outdoor"] .bigmetric{font-size:44px}body[data-theme="outdoor"] .status-detail,body[data-theme="outdoor"] .cardtag,body[data-theme="outdoor"] .small,body[data-theme="outdoor"] .tiny{font-size:13px;color:#252525}body[data-theme="outdoor"] .last,body[data-theme="outdoor"] .runnum,body[data-theme="outdoor"] .status-card,body[data-theme="outdoor"] .tag{background:#fff;color:#000}body[data-theme="outdoor"] .status-card.next{background:#e8fff2;border:3px solid #00581e}body[data-theme="outdoor"] .status-card.near{background:#fff5d4;border:3px solid #9d5500}body[data-theme="outdoor"] .status-card.drop{background:#fff0f0;border:3px solid #990000}body[data-theme="outdoor"] .notice{color:#111;background:#fff4c2;border:2px solid #101010;font-size:14px}body[data-theme="outdoor"] .bubble.in{border:2px solid #111}body[data-theme="outdoor"] .bubble.o /* v4 administration: focused pages, restrained hierarchy and mobile-first controls. */
.admin-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.admin-header h2{font-size:22px;letter-spacing:-.3px;margin:3px 0}

.admin-context,.admin-count{font-size:12px;color:var(--muted);font-weight:650}

.admin-overview{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:14px}

.admin-date-fields input,.admin-add-team input{width:100%}

.admin-search-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0}

.admin-search-actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);padding-top:12px}

body[data-theme="outdoor"] button.danger-light{background:#fff3ee;color:#850b00;border:2px solid #850b00}

@media(max-width:550px){
 .admin-pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;gap:7px}
 .admin-pages button{white-space:normal;padding:8px 9px;min-width:0}
 .admin-pages button:last-child{grid-column:1/-1}
}

<body>
<header class="header"><div class="head-inner"><div class="identity"><div aria-hidden="true" class="mark">✦</div><div><b>Scent Trial</b><small>EVENTS · TRIALS · SMS</small></div></div><div class="demo-badge">ADMIN CLEANUP · OFFLINE DEMO</div></div></header>
<main class="wrap" id="app"></main>
<script>
'use strict';
// Everything in this file runs only in this browser tab. There are no network requests.
const participants=[
 ['Atlas','Morgan'],['Fern','Lee'],['Biscuit','Ava'],['Scout','Chris'],['Nova','Jordan'],['Pepper','Alex'],['Juniper','Sam'],['Maple','Casey'],['Echo','Robin'],['Blue','Dana'],['Willow','Reese'],['Rocket','Taylor'],['Wren','Jules'],['Cedar','Quinn'],['Pip','Jamie'],['Tye','Tomas'],['Louie','Pat'],['Moxie','Harper'],['Sage','Blake'],['Finn','Drew'],['Kona','Sky'],['Olive','Elliot'],['Banjo','Leslie'],['Roo','Avery'],['Ginger','Riley'],['Hazel','Parker'],['Tucker','Jess'],['Luna','Shawn'],['Lark','Peyton'],['Otis','Rory'],['Raven','Noel'],['Fable','Charlie'],['Juno','Remy'],['Ember','Bailey'],['Milo','Frankie'],['Indie','Emerson']
];
let roster=participants.map((p,i)=>({id:String(i+1),num:i+1,dog:p[0],handler:p[1]}));
const byId=id=>roster.find(d=>d.id===String(id));
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const label=id=>{const d=byId(id);return d?`${escapeHTML(d.dog)} <span class="muted">· ${escapeHTML(d.handler)}</span>`:'—'};
const plain=id=>{const d=byId(id);return d?`#${d.num} ${d.dog}`:'#?'};
const time=()=>new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function startQueue(startId){const idx=Math.max(0,roster.findIndex(d=>d.id===String(startId)));return roster.slice(idx).concat(roster.slice(0,idx)).map(d=>d.id);}
function search(name,start,count=4,active=true){const startId=String(start);return {name,startId,queue:startQueue(startId),sent:[],dropped:[],count,active,log:[]};}
const state={tab:'dog',selected:'16',hold:false,subscribed:new Set(['16']),inboxes:{},activity:[],showExtra:{},searches:[search('Vehicles',10,5),search('Interior · Chapel',12,3),search('Exterior · Chapel',14,4)]};
// Trial and day configuration is local to this browser. Each day has its own roster, queues and mock SMS inbox.
function sampleDay(date,label){const rr=roster.map(d=>({...d}));return {date,label,roster:rr,hold:false,subscribed:new Set(),inboxes:{},activity:[],searches:[search('Vehicles',10,5),search('Interior · Chapel',12,3),search('Exterior · Chapel',14,4)]};}
const firstDay={date:'2026-10-17',label:'Saturday · example',roster:roster.map(d=>({...d})),searches:state.searches,hold:state.hold,subscribed:state.subscribed,inboxes:state.inboxes,activity:state.activity};
state.events=[{id:'summit',name:'Pikes Peak Nose Work Summit'},{id:'separate',name:'Front Range Weekend Trials'}];
state.trials=[
 {name:'NW3 · Summit Trial A',eventId:'summit',days:[firstDay,sampleDay('2026-10-18','Sunday · Trial A')]},
 {name:'NW3 · Summit Trial B',eventId:'summit',days:[sampleDay('2026-10-17','Saturday · Trial B')]},
 {name:'Elite · Summit Trial C',eventId:'summit',days:[sampleDay('2026-10-18','Sunday · Trial C')]},
 {name:'NW3 · Front Range Trial',eventId:'separate',days:[sampleDay('2026-11-07','Saturday · Trial 1'),sampleDay('2026-11-08','Sunday · Trial 1')]},
 {name:'L1 · Front Range Trial',eventId:'separate',days:[sampleDay('2026-11-07','Saturday · Trial 2')]}
];
state.trial=0;state.day=0;
const currentTrial=()=>state.trials[state.trial];
const currentEvent=()=>state.events.find(e=>e.id===currentTrial().eventId)||state.events[0];
const eventTrialIndices=id=>state.trials.map((t,i)=>({t,i})).filter(x=>x.t.eventId===id).map(x=>x.i);
const eventDates=id=>[...new Set(eventTrialIndices(id).flatMap(i=>state.trials[i].days.map(d=>d.date)))].sort();
const trialsOnDate=(eventId,date)=>eventTrialIndices(eventId).filter(i=>state.trials[i].days.some(d=>d.date===date));
function selectTrialDay(ti,date){state.trial=ti;const index=currentTrial().days.findIndex(d=>d.date===date);state.day=index>=0?index:0;switchDay();}
const dayTitle=()=>`${currentDay().date} · ${currentTrial().name}`;
state.role='admin';state.tab='admin';state.theme='indoor';state.adminSection='overview';state.showFullRoster=false;
const currentDay=()=>currentTrial().days[state.day];
for(const k of ['searches','hold','subscribed','inboxes','activity']){delete state[k];Object.defineProperty(state,k,{enumerable:false,configurable:true,get(){return currentDay()[k]},set(v){currentDay()[k]=v;}});}
function switchDay(){roster=currentDay().roster;state.showExtra={};if(!roster.some(d=>d.id===state.selected))state.selected=roster[0]?.id||'';if(roster.length&&state.selected)ensureInbox(state.selected);}
function blankDay(date,label){return {date,label,roster:roster.map(d=>({...d})),searches:[search('Vehicles',roster[0]?.id||'1',5),search('Interior',roster[Math.min(1,roster.length-1)]?.id||'1',3),search('Exterior',roster[Math.min(2,roster.length-1)]?.id||'1',4)],hold:false,subscribed:new Set(),inboxes:{},activity:[]};}
function trialBar(){const event=currentEvent(),date=currentDay().date,dates=eventDates(event.id),available=trialsOnDate(event.id,date);return `<div class="trialbar" aria-label="Event and trial date selectors"><div class="field"><label for="eventSelect">Event</label><select id="eventSelect">${state.events.map(e=>`<option value="${escapeHTML(e.id)}" ${e.id===event.id?'selected':''}>${escapeHTML(e.name)}</option>`).join('')}</select></div><div class="field"><label for="dateSelect">Calendar date</label><select id="dateSelect">${dates.map(d=>`<option value="${escapeHTML(d)}" ${d===date?'selected':''}>${escapeHTML(d)}</option>`).join('')}</select></div><div class="field"><label for="trialSelect">Trial on this date</label><select id="trialSelect">${available.map(i=>`<option value="${i}" ${state.trial===i?'selected':''}>${escapeHTML(state.trials[i].name)}</option>`).join('')}</select></div></div><div class="view-settings"><div class="field"><div class="field"><label for="themeSelect">Display</label><select id="themeSelect"><option value="indoor" ${state.theme==='indoor'?'selected':''}>Indoor · high contrast</option><option value="outdoor" ${state.theme==='outdoor'?'selected':''}>Outdoor · sunlight</option></select></div></div>`;}

function roleSwitcher(){return `<div class="role-switcher" role="group" aria-label="Switch local demo roles"><div class="switch-label"><b>Choose a mode</b><span>Switch between screens here · not an actual login</span></div><div class="role-buttons"><button type="button" data-role="viewer" class="${state.role==='viewer'?'primary':''}" aria-pressed="${state.role==='viewer'}">My Dog</button><button type="button" data-role="steward" class="${state.role==='steward'?'primary':''}" aria-pressed="${state.role==='steward'}">Steward</button><button type="button" data-role="admin" class="${state.role==='admin'?'primary':''}" aria-pressed="${state.role==='admin'}">Admin</button></div></div>`;}
const app=document.getElementById('app');
function stamp(who,text){const id=String(state.selected);if(!state.inboxes[id])state.inboxes[id]=[];state.inboxes[id].push({who,text,at:time()});}
function addMessage(id,who,text){id=String(id);state.inboxes[id]??=[];state.inboxes[id].push({who,text,at:time()});}
function log(text){state.activity.unshift({at:time(),text});state.activity=state.activity.slice(0,150);}
function ensureInbox(id){id=String(id);const d=byId(id);if(!d)return;if(!state.inboxes[id])state.inboxes[id]=[{who:'in',text:`SCENT TRIAL DEMO — Welcome, ${d.dog}! This is a local simulation. No actual SMS will be sent. Reply STATUS for your positions, or STOP to opt out.`,at:time()}];}
ensureInbox('16');
function pos(s,id){return s.queue.indexOf(id);}
function describe(s,id){if(s.sent.includes(id))return {name:'Already sent',detail:'Your dog was dispatched',type:'done',num:'✓'};if(s.dropped.includes(id))return {name:'Dropped',detail:'Ask the gate steward',type:'drop',num:'—'};const n=pos(s,id);if(n<0)return {name:'Not queued',detail:'Ask the gate steward',type:'drop',num:'—'};if(n===0)return {name:state.hold?'Next · paused':'NEXT TO SEND',detail:'0 dogs ahead',type:'next',num:'0'};if(n<=2)return {name:state.hold?'Paused · on deck':'ON DECK',detail:`${n} ${n===1?'dog':'dogs'} ahead`,type:'near',num:String(n)};if(n<=s.count-1)return {name:state.hold?'Paused':'On deck group',detail:`${n} dogs ahead`,type:'near',num:String(n)};return {name:state.hold?'Paused':'Waiting',detail:`${n} dogs ahead`,type:'wait',num:String(n)};}
function statusReply(id){const d=byId(id);if(!d)return 'No selected dog. Choose a dog in the demo.';const lines=state.searches.filter(s=>s.active).map(s=>{const q=describe(s,id);if(q.name==='Already sent'||q.name==='Dropped')return `${s.name}: ${q.name}`;return `${s.name}: ${q.detail}${pos(s,id)===0?' — NEXT':''}`;});return `STATUS · ${d.dog} (#${d.num}) · ${currentTrial().name} / ${currentDay().label}\n${state.hold?'WEATHER HOLD — dispatch paused.\n':''}${lines.length?lines.join('\n'):'No active searches.'}\n${state.hold?'No dogs may be dispatched until the hold ends.':'Positions are based on the current trial queue.'}`;}
function receiveSMS(command){const id=state.selected;ensureInbox(id);const cleaned=String(command||'').trim().slice(0,160);if(!cleaned)return;addMessage(id,'out',cleaned);const cmd=cleaned.toUpperCase().split(/\s+/)[0];if(cmd==='STOP'||cmd==='UNSUBSCRIBE'||cmd==='CANCEL'){state.subscribed.delete(id);addMessage(id,'in','You are unsubscribed from Scent Trial demo alerts. Reply START to opt in again.');log(`${plain(id)} unsubscribed via mock SMS`);}else if(cmd==='START'||cmd==='UNSTOP'){state.subscribed.add(id);addMessage(id,'in',`You are subscribed to DEMO alerts for ${byId(id).dog}. Reply STATUS for positions. Reply STOP to opt out.`);log(`${plain(id)} subscribed via mock SMS`);}else if(cmd==='STATUS'){if(!state.subscribed.has(id))addMessage(id,'in','You are unsubscribed. Reply START to rejoin demo notifications.');else addMessage(id,'in',statusReply(id));}else if(cmd==='HELP'){addMessage(id,'in','Scent Trial DEMO: Reply STATUS for your dog’s positions, START to subscribe, or STOP to opt out. This is a simulation; no SMS is sent.');}else{addMessage(id,'in','Command not recognized. Reply STATUS, HELP, START or STOP. Demo only.');}}
function mockNotify(id,text){if(!state.subscribed.has(String(id)))return;ensureInbox(id);addMessage(id,'in',`SCENT TRIAL DEMO · ${text}`);log(`Mock SMS → ${plain(id)}: ${text}`);}
// Send one highest-urgency alert when a position moves across a threshold.
function alertsFor(searchBefore,s){for(const id of state.subscribed){const old=searchBefore.indexOf(id),n=s.queue.indexOf(id);if(old<0||n<0||n>=old)continue;let alert=null;if(old>0&&n===0)alert=`${byId(id).dog} is NEXT TO SEND for ${s.name}. Please report to the gate steward.`;else if(old>2&&n<=2)alert=`${byId(id).dog} has ${n} dogs ahead in ${s.name}. Please get ready.`;else if(old>5&&n<=5)alert=`${byId(id).dog} has ${n} dogs ahead in ${s.name}. Time to prepare.`;if(alert)mockNotify(id,alert);}}
function dispatch(s,type,id,anchor,skipCount=1){if(state.role==='viewer')return;if(state.hold||!s.active){log('Blocked dispatch: trial on hold or search inactive');return;}const before=s.queue.slice();if(type==='send'){if(!s.queue.length)return;const target=s.queue.shift();s.sent.push(target);log(`${s.name}: sent ${plain(target)}`);}else if(type==='skip'){if(s.queue.length<2)return;const count=Math.min(s.queue.length-1,Math.max(1,Number.parseInt(skipCount,10)||1));const target=s.queue.shift();s.queue.splice(count,0,target);log(`${s.name}: skipped ${plain(target)} by ${count} position${count===1?'':'s'}`);}else if(type==='out'){const i=s.queue.indexOf(id);if(i<0)return;const target=s.queue.splice(i,1)[0];s.sent.push(target);log(`${s.name}: sent ${plain(target)} out of order`);}else if(type==='drop'){const i=s.queue.indexOf(id);if(i<0)return;const target=s.queue.splice(i,1)[0];s.dropped.push(target);log(`${s.name}: dropped ${plain(target)}`);}else if(type==='restore'){const i=s.dropped.indexOf(id);if(i<0)return;s.dropped.splice(i,1);s.queue.push(id);log(`${s.name}: restored ${plain(id)} at end`);}else if(type==='move'){if(!s.queue.includes(id))return;s.queue=s.queue.filter(d=>d!==id);s.queue.unshift(id);log(`${s.name}: moved ${plain(id)} to front`);}else if(type==='before'||type==='after'){if(id===anchor||!s.queue.includes(id)||!s.queue.includes(anchor))return;s.queue=s.queue.filter(d=>d!==id);s.queue.splice(s.queue.indexOf(anchor)+(type==='after'?1:0),0,id);log(`${s.name}: moved ${plain(id)} ${type} ${plain(anchor)}`);}alertsFor(before,s);}
function changeHold(value){if(state.role!=='admin')return;state.hold=value;log(value?'Administrator set WEATHER HOLD':'Administrator resumed searches');for(const id of state.subscribed)mockNotify(id,value?'WEATHER HOLD. All searches are paused. Please remain available.':'WEATHER HOLD LIFTED. Running positions are unchanged. Text STATUS for current positions.');}
function options(selected){return roster.map(d=>`<option value="${d.id}" ${String(d.id)===String(selected)?'selected':''}>#${d.num} ${escapeHTML(d.dog)} — ${escapeHTML(d.handler)}</option>`).join('');}
function positionCards(){return state.searches.filter(s=>s.active).map(s=>{const q=describe(s,state.selected);return `<div class="status-card ${q.type}"><h3>${escapeHTML(s.name)}</h3><div class="bigmetric">${q.num}</div><div class="status-name">${escapeHTML(q.name)}</div><div class="status-detail">${escapeHTML(q.detail)}</div><div class="cardtag">${q.type==='done'?'Completed':q.type==='drop'?'Check with steward':q.type==='next'?'Report to gate':q.type==='near'?'Be ready':'Track progress'}</div></div>`;}).join('');}
function smsPhone(){ensureInbox(state.selected);const m=state.inboxes[state.selected];return `<div class="sms-sim"><div class="phone"><div class="phone-top"><div class="avatar">✦</div><div><strong>Scent Trial · DEMO messages</strong><small>Simulated SMS · no cellular connection</small></div></div><div class="messages" id="smsMessages" aria-label="Mock text messages">${m.length?m.map(x=>`<div class="bubble ${x.who==='out'?'out':'in'}">${escapeHTML(x.text)}<span class="when">${escapeHTML(x.at)} · demo</span></div>`).join(''):'<div class="empty-chat">Choose STATUS to request your trial position.</div>'}</div><form class="chat-send" id="smsForm"><label class="sr-only" for="smsInput">Mock text message</label><input id="smsInput" autocomplete="off" maxlength="160" placeholder="Text STATUS, STOP, START..."><button class="primary" aria-label="Send simulated text" type="submit">➤</button></form></div><div class="sms-mock">Local simulation only · 0 real texts sent · no charges</div></div><div class="quick" aria-label="Test text commands"><button data-sms="STATUS">Text STATUS</button><button data-sms="STOP">Text STOP</button><button data-sms="START">Text START</button><button data-sms="HELP">Text HELP</button></div>`;}
function dogView(){const d=byId(state.selected);if(!d)return `<section class="panel"><h2>No teams in this day</h2><p>The administrator can add this trial day’s running order.</p></section>`;return `<div class="cols"><div><section class="panel"><div class="sectionhead"><div><span class="eyebrow">Competitor view</span><h2>Follow your dog</h2><p>See your position in every active search, even when starting positions differ.</p></div></div><div class="dog-select"><div><label for="watchDog">Dog / run number</label><select id="watchDog">${options(state.selected)}</select></div><span class="tag">${roster.length} sample teams</span></div><div style="height:14px"></div><div class="status-grid">${positionCards()||'<p>No active searches.</p>'}</div><div class="steps"><span class="tag">Local queue preview</span><span class="tag">Actual remaining queue</span><span class="tag">Independent searches</span></div><div class="subtle" style="margin-top:15px"><h3 style="margin-bottom:5px">How this works without competitor internet</h3><p class="muted small">At a real trial, only the administrator needs an internet connection to the server. The competitor can receive ordinary cellular texts and reply STATUS. This phone screen is a simulation, not a working SMS gateway.</p></div></section><section class="panel" style="margin-top:13px"><div class="sectionhead"><div><h2>Try an automatic alert</h2><p>Open Running board, send the next dog in a search, then return here to see whether an SMS alert was triggered.</p></div></div><div class="steps"><button class="primary" data-tab="board">Open running board</button>${state.role!=='viewer'?`<button data-action="fast" title="Advance the first active search three times" ${!state.searches.some(s=>s.active&&s.queue.length)?'disabled':''}>Advance first search 3 dogs</button>`:''}</div></section></div><div><section class="panel"><div class="sectionhead"><div><span class="eyebrow">SMS fallback</span><h2>Text conversation · ${escapeHTML(d.dog)}</h2><p>All messages stay on this device.</p></div></div><div class="check" style="margin-bottom:12px"><input id="optin" type="checkbox" ${state.subscribed.has(state.selected)?'checked':''}><div><label for="optin">Demo alerts enabled</label><p>Only opted-in sample dogs receive simulated alerts when a queue crosses 5, 2 or 0 dogs ahead.</p></div></div>${smsPhone()}</section></div></div>`;}
function boardCard(s,i){const last=byId(s.sent.at(-1)),next=byId(s.queue[0]),extra=state.showExtra[i];return `<article class="search-board"><div class="top"><div class="tiny">Search ${i+1} · ACTIVE</div><h3>${escapeHTML(s.name)}</h3><div class="meta">${s.sent.length} sent · ${s.queue.length} waiting · ${s.dropped.length} dropped</div></div><div class="last"><div class="tiny">Last dog sent</div><strong>${last?escapeHTML(last.dog):'None yet'}</strong><span class="muted small">${last?'#'+last.num+' · '+escapeHTML(last.handler):'Awaiting dispatch'}</span></div><div class="deck"><div class="tiny">Next to send</div></div><div class="nextline"><div class="runnum">${next?'#'+next.num:'—'}</div><div><strong>${next?label(next.id):'Search finished'}</strong><div class="muted small">First in actual dispatch queue</div></div></div><div class="deck"><div class="deckhead"><strong class="tiny">On deck</strong><span class="small muted">Top ${s.count} dogs</span></div>${s.queue.slice(0,s.count).map((id,p)=>`<div class="deck-row ${id===state.selected?'mine':''}"><span class="index">${p+1}</span><span class="runnum" style="padding:5px 4px;min-width:31px;font-size:11px">#${byId(id).num}</span><span>${label(id)} ${id===state.selected?'<span class="tag urgent">FOLLOWED</span>':''}</span></div>`).join('')||'<p class="small muted">No dogs waiting</p>'}</div>${state.role!=='viewer'?`<div class="board-actions"><button class="primary" data-do="send" data-idx="${i}" ${state.hold||!s.queue.length?'disabled':''}>Send next</button><div class="skip-control"><label for="skip-count-${i}">Skip positions</label><input id="skip-count-${i}" type="number" inputmode="numeric" min="1" max="${Math.max(1,s.queue.length-1)}" value="1" aria-label="Number of positions to skip in ${escapeHTML(s.name)}"><button data-do="skip" data-idx="${i}" ${state.hold||s.queue.length<2?'disabled':''}>Skip</button></div><button class="soft" data-expand="${i}">${extra?'Hide actions':'More actions'}</button>${extra?`<div class="inline-controls" style="width:100%"><label for="extra-${i}">Choose a waiting dog</label><select id="extra-${i}">${s.queue.map(id=>`<option value="${id}">${plain(id)} — ${escapeHTML(byId(id).handler)}</option>`).join('')}</select><div class="selectrow"><button data-do="out" data-idx="${i}" ${state.hold?'disabled':''}>Send out of order</button><button data-do="move" data-idx="${i}" ${state.hold?'disabled':''}>Move to front</button><button data-do="drop" data-idx="${i}" ${state.hold?'disabled':''}>Drop</button></div><label for="anchor-${i}">Reposition selected dog relative to</label><select id="anchor-${i}">${s.queue.map(id=>`<option value="${id}">${plain(id)} — ${escapeHTML(byId(id).handler)}</option>`).join('')}</select><div class="selectrow"><button data-do="before" data-idx="${i}">Move before</button><button data-do="after" data-idx="${i}">Move after</button></div>${s.dropped.length?`<label for="restore-${i}">Dropped dogs</label><select id="restore-${i}">${s.dropped.map(id=>`<option value="${id}">${plain(id)}</option>`).join('')}</select><button data-do="restore" data-idx="${i}">Restore to end</button>`:''}</div>`:''}</div>`:'<div class="board-actions"><span class="small muted">Read-only running board · switch to Gate steward demo role to try dispatching.</span></div>'}</article>`;}
function boardView(){const hold=state.hold?`<div class="banner-hold"><strong>⚠ WEATHER HOLD — no dogs may be dispatched</strong>${state.role==='admin'?'<button class="primary" data-action="resume">Resume</button>':''}</div>`:'';return `${hold}<div class="sectionhead"><div><span class="eyebrow">Running board · ${escapeHTML(state.role)}</span><h2>Live running board</h2><p>Each search advances independently. Dispatch controls are available in Gate Steward and Administrator roles.</p></div><div><button class="soft" data-tab="dog">My dog / SMS</button></div></div><div class="board-grid">${state.searches.map((s,i)=>s.active?boardCard(s,i):'').join('')||'<section class="panel"><h3>No active searches</h3><p>Administrator can activate searches for this trial day.</p></section>'}</div><p class="muted small" style="margin-top:14px">All dispatches are simulated locally. This screen has no authentication and must not be used to run a real trial.</p>`;}
function adminView(){const msgs=Object.values(state.inboxes).reduce((n,v)=>n+v.filter(m=>m.who==='in').length,0);return `<div class="cols"><div><section class="panel"><div class="sectionhead"><div><span class="eyebrow">Trial control</span><h2>Administrator controls</h2><p>Simulate the administrator who has the only internet connection at the venue.</p></div></div><div class="banner-hold"><div><strong>${state.hold?'⚠ Weather hold active':'✓ Searches are running'}</strong><div class="small">${state.hold?'Queue order is preserved.':'Dispatches are allowed.'}</div></div><button class="${state.hold?'primary':'warn'}" data-action="${state.hold?'resume':'hold'}">${state.hold?'Lift hold':'Set weather hold'}</button></div><div class="admin-cards"><div class="metricbox"><strong>${state.subscribed.size}</strong><span>Simulated opted-in recipients</span></div><div class="metricbox"><strong>${msgs}</strong><span>Simulated inbound-to-phone messages</span></div><div class="metricbox"><strong>0</strong><span>Actual SMS messages sent</span></div><div class="metricbox"><strong>0</strong><span>Servers / APIs connected</span></div></div><div class="subtle" style="margin-top:13px"><h3>Planned production behavior</h3><p class="small muted" style="margin-top:6px">Set up trial names, multiple days, running order, search starts, on-deck sizes and active searches under Full trial setup. An internet-connected administrator would update the server. A server-side SMS provider would send alerts to opted-in competitors, process STATUS/STOP replies, and log delivery failures. For a real event, this requires backend deployment, phone number registration, consent handling and a messaging account.</p></div><div class="steps"><button data-tab="setup" class="primary">Trial setup · event, days and searches</button><button data-tab="board">Open dispatch board</button><button data-action="reset">Reset day queues</button></div></section></div><div><section class="panel"><div class="sectionhead"><div><h2>Recent actions</h2><p>In-memory log from this device only.</p></div></div><div class="log">${state.activity.length?state.activity.map(x=>`<div class="logentry"><small>${escapeHTML(x.at)}</small><div>${escapeHTML(x.text)}</div></div>`).join(''):'<p class="small muted">No updates yet. Dispatch a dog or text STATUS to begin.</p>'}</div></section><section class="panel" style="margin-top:13px"><h3>Notification rules shown in this demo</h3><div class="steps"><span class="tag">5 dogs ahead</span><span class="tag">2 dogs ahead</span><span class="tag urgent">Next to send</span><span class="tag warn">Weather hold</span></div><p class="small muted" style="margin-top:11px">The mock alert engine sends a single most-urgent message when one update crosses more than one threshold, rather than flooding the competitor.</p></section></div></div>${scheduleAdminView()}`;}

function scheduleAdminView(){const e=currentEvent();const rows=eventDates(e.id).map(date=>{const sessions=eventTrialIndices(e.id).flatMap(i=>state.trials[i].days.map((d,di)=>({i,di,d}))).filter(x=>x.d.date===date);return `<div class="schedule-day"><h3>${escapeHTML(date)} <span class="muted small">· ${sessions.length} trial${sessions.length===1?'':'s'}</span></h3>${sessions.map(x=>`<div class="schedule-row"><div><strong>${escapeHTML(state.trials[x.i].name)}</strong><div class="small muted">${x.d.searches.length} searches · ${x.d.roster.length} dogs · ${escapeHTML(x.d.label)}</div></div><button class="sm ${state.trial===x.i&&state.day===x.di?'primary':''}" data-jump="${x.i}:${x.di}">${state.trial===x.i&&state.day===x.di?'Selected':'Open day'}</button></div>`).join('')}</div>`;}).join('');return `<section class="panel" style="margin-top:15px"><div class="sectionhead"><div><h2>Event schedule · ${escapeHTML(e.name)}</h2><p>One event can have multiple trials. Trials may span days, and multiple trials may share a date. Each trial-day has separate searches and queues.</p></div></div>${rows}</section>`;}
function setupView(){const d=currentDay(),t=currentTrial();return `<div class="sectionhead"><div><span class="eyebrow">Full administrator trial setup</span><h2>Configure event, trial, calendar day and searches</h2><p>The original admin controls are back, with editable trials/days and offline CSV import. Each trial-day instance has its own roster, searches, starts and dispatch progress. Multiple trials may share the same calendar date.</p></div></div><section class="panel event-settings"><h3>Event setup</h3><p class="muted small">An event can group several trials, such as a Summit. The same date may contain two or more separate trials.</p><div class="formrow"><div><label for="editEventName">Current event name</label><input id="editEventName" value="${escapeHTML(currentEvent().name)}" maxlength="100"></div><button data-setup="renameEvent">Save event</button></div><div class="formrow"><div><label for="newEventName">Create new event</label><input id="newEventName" placeholder="New event name" maxlength="100"></div><button class="primary" data-setup="addEvent">Add event</button></div></section><div class="setup-grid"><section class="panel"><h3>1 · Trial and calendar date</h3><div class="settings-col"><div class="formrow"><div><label for="editTrialName">Trial name</label><input id="editTrialName" value="${escapeHTML(t.name)}" maxlength="100"></div><button data-setup="renameTrial">Save name</button></div><div class="formrow"><div><label for="newTrialName">Create another trial in this event, on this date</label><input id="newTrialName" placeholder="Trial name" maxlength="100"></div><button data-setup="addTrial" class="primary">Add trial</button></div><div class="formrow"><div><label for="editDayName">Day label</label><input id="editDayName" value="${escapeHTML(d.label)}" maxlength="100"></div><div><label for="editDayDate">Date</label><input id="editDayDate" type="date" value="${escapeHTML(d.date)}"></div><button data-setup="renameDay">Save day</button></div><div class="formrow"><div><label for="newDayDate">Add day to this trial</label><input id="newDayDate" type="date" value="${escapeHTML(d.date)}"></div><button data-setup="addDay" class="primary">Add day</button></div></div><p class="muted small">Use Event, Calendar date and Trial menus above to switch. More than one trial can run on a date. Existing dispatch progress is retained while this file stays open.</p></section>
<section class="panel"><h3>2 · Master running order</h3><p class="muted small">${roster.length} teams. Paste spreadsheet rows, or upload a CSV/TSV file. Column order: run number, dog, handler. The import replaces this day's master roster and resets its search histories.</p><div class="settings-col"><label for="rosterPaste">Paste CSV or spreadsheet rows</label><textarea id="rosterPaste" rows="5" placeholder="Run,Dog,Handler\n1,Atlas,Morgan\n2,Fern,Lee"></textarea><div class="steps"><button data-setup="importPaste" class="primary">Import pasted roster</button><label for="rosterFile" class="filelabel">Choose CSV/TSV file</label><input id="rosterFile" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values" class="hidden-file"></div><p class="muted small">Excel .xlsx files can be saved as CSV first. This offline HTML file doesn't upload anything.</p><div class="formrow"><div><label for="addRun">Run #</label><input type="number" min="1" id="addRun" value="${Math.max(0,...roster.map(x=>x.num))+1}"></div><div><label for="addDog">Dog name</label><input id="addDog" placeholder="Dog"></div><div><label for="addHandler">Handler</label><input id="addHandler" placeholder="First name"></div><button data-setup="addTeam">Add team</button></div><div class="roster-peek">${roster.slice(0,8).map(x=>`<span class="tag">#${x.num} ${escapeHTML(x.dog)} · ${escapeHTML(x.handler)}</span>`).join('')} ${roster.length>8?`<span class="small muted">+ ${roster.length-8} more</span>`:''}</div></div></section></div>
<section class="panel" style="margin-top:14px"><div class="sectionhead"><div><h3>3 · Searches for this trial on ${escapeHTML(d.date)}</h3><p>Set each search's starting dog in the circular running order, on-deck count, and active status.</p></div><button data-setup="addSearch" class="primary">+ Add search</button></div><div class="setup-searches">${state.searches.map((s,i)=>`<article class="setup-search"><div class="settings-col"><label for="searchName-${i}">Search ${i+1} name</label><input id="searchName-${i}" maxlength="100" value="${escapeHTML(s.name)}"><label for="searchStart-${i}">Starting dog / run number</label><select id="searchStart-${i}">${options(s.startId||s.queue[0]||roster[0]?.id)}</select><div class="on-deck-control"><div><strong>On-deck group</strong><p class="muted small">${s.count} dogs (includes next to send)</p></div><div class="steps"><button data-setup="deckMinus" data-idx="${i}" ${s.count<=1?'disabled':''}>−</button><b>${s.count}</b><button data-setup="deckPlus" data-idx="${i}" ${s.count>=10?'disabled':''}>+</button></div></div><div class="steps"><button class="${s.active?'soft':'primary'}" data-setup="toggleActive" data-idx="${i}">${s.active?'Deactivate':'Activate'}</button><button data-setup="saveSearch" data-idx="${i}" class="primary">Save search</button><button data-setup="resetSearch" data-idx="${i}">Reset queue</button><button data-setup="removeSearch" data-idx="${i}">Remove</button></div><p class="small muted">${s.sent.length} sent · ${s.queue.length} waiting · ${s.dropped.length} dropped${s.active?'':' · INACTIVE'}</p></div></article>`).join('')||'<p>No searches yet. Add one above.</p>'}</div></section>
<section class="panel" style="margin-top:14px"><h3>4 · Save/share trial setup</h3><p class="muted small" style="margin:7px 0 10px">This demo runs locally and does not automatically sync or store changes after closing. Export JSON to retain trial settings and progress, then import it on the same or another device. Do not import unknown files.</p><div class="steps"><button data-setup="export">Download setup backup (.json)</button><label for="backupFile" class="filelabel">Restore setup backup</label><input id="backupFile" class="hidden-file" type="file" accept="application/json,.json"><button data-action="reset">Reset this day's queues & messages</button></div></section>`;}
function parseCSVLine(line,delimiter){const out=[];let field='',quoted=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){field+='"';i++;}else quoted=!quoted;}else if(c===delimiter&&!quoted){out.push(field.trim());field='';}else field+=c;}if(quoted)throw Error('CSV has an unmatched quote.');out.push(field.trim());return out;}
function parseRosterText(text){const raw=String(text||'').replace(/^\uFEFF/,'').trim();if(!raw)throw Error('Paste at least one roster row.');const lines=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const delim=lines[0].includes('\t')?'\t':',';const arr=lines.map(l=>parseCSVLine(l,delim));if(arr.length&&/^(run|number|#|dog|handler)/i.test(arr[0][0]))arr.shift();if(!arr.length)throw Error('No dog rows found.');if(arr.length>500)throw Error('Maximum 500 teams for this local demo.');const seen=new Set();const result=arr.map((row,i)=>{let n,dog,handler;if(row.length>=3){n=Number(row[0]);dog=row[1];handler=row.slice(2).join(' ');}else if(row.length===2){n=i+1;dog=row[0];handler=row[1];}else throw Error(`Row ${i+1} needs a dog and handler.`);if(!Number.isInteger(n)||n<1||n>99999)throw Error(`Row ${i+1} has an invalid run number.`);if(seen.has(n))throw Error(`Duplicate run number #${n}.`);if(!dog)throw Error(`Row ${i+1} is missing a dog name.`);seen.add(n);return {id:String(n),num:n,dog:String(dog).slice(0,100),handler:String(handler||'').slice(0,100)};});return result;}
function applyRoster(newRoster){if(!newRoster.length)throw Error('Roster cannot be empty.');if(!confirm(`Replace the roster for ${currentDay().label} with ${newRoster.length} teams? This resets all search dispatch histories for this day.`))return;roster=newRoster;currentDay().roster=newRoster;for(const s of state.searches){s.startId=roster[0].id;s.queue=startQueue(s.startId);s.sent=[];s.dropped=[];s.log=[];}state.selected=roster[0].id;state.subscribed=new Set();state.inboxes={};state.activity=[];state.showExtra={};log(`Imported ${roster.length} teams; all search queues reset`);ensureInbox(state.selected);render();}
function downloadBlob(name,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportSetup(){const data={version:2,events:state.events,trials:state.trials.map(t=>({name:t.name,eventId:t.eventId,days:t.days.map(d=>({...d,subscribed:[...d.subscribed]}))})),trial:state.trial,day:state.day,selected:state.selected};downloadBlob('scent-trial-demo-backup.json',JSON.stringify(data,null,2),'application/json');}
function importSetup(text){if(state.role!=='admin')return;const input=JSON.parse(text);if(![1,2].includes(input.version)||!Array.isArray(input.trials)||!input.trials.length||input.trials.length>100)throw Error('Unsupported backup structure.');const trials=input.trials.map(t=>{if(typeof t.name!=='string'||!Array.isArray(t.days)||!t.days.length||t.days.length>100)throw Error('Trial/day data is invalid.');return {name:t.name.slice(0,100),eventId:typeof t.eventId==='string'?t.eventId:'imported',days:t.days.map(d=>{if(!Array.isArray(d.roster)||!d.roster.length||d.roster.length>500||!Array.isArray(d.searches))throw Error('A day has invalid roster/search data.');const rr=d.roster.map(x=>({id:String(x.id),num:Number(x.num),dog:String(x.dog).slice(0,100),handler:String(x.handler).slice(0,100)}));const unique=new Set(rr.map(x=>x.id));if(rr.some(x=>!/^\d+$/.test(x.id)||!x.dog||!Number.isInteger(x.num)||x.num<1||String(x.num)!==x.id)||unique.size!==rr.length)throw Error('A roster contains invalid or duplicate teams.');const ss=d.searches.map(s=>{const startId=String(s.startId||rr[0].id);const ids=new Set(rr.map(x=>x.id));const cleaned=k=>Array.isArray(k)?k.map(String).filter(x=>ids.has(x)):[];const queue=cleaned(s.queue),sent=cleaned(s.sent),dropped=cleaned(s.dropped);if(new Set([...queue,...sent,...dropped]).size!==queue.length+sent.length+dropped.length)throw Error('The queue backup contains duplicate teams.');return {name:String(s.name||'Search').slice(0,100),startId,queue,sent,dropped,count:Math.max(1,Math.min(10,Number(s.count)||4)),active:!!s.active,log:Array.isArray(s.log)?s.log.slice(0,100):[]};});return {date:String(d.date||''),label:String(d.label||'Day').slice(0,100),roster:rr,searches:ss,hold:!!d.hold,subscribed:new Set(Array.isArray(d.subscribed)?d.subscribed.map(String).filter(x=>unique.has(x)):[]),inboxes:typeof d.inboxes==='object'&&d.inboxes&&!Array.isArray(d.inboxes)?d.inboxes:{},activity:Array.isArray(d.activity)?d.activity.slice(0,100):[]};})};});if(!confirm('Replace all local demo trials with the setup backup?'))return;state.events=Array.isArray(input.events)&&input.events.length?input.events.filter(e=>e&&typeof e.name==='string'&&typeof e.id==='string').map(e=>({id:e.id.slice(0,100),name:e.name.slice(0,100)})):[{id:'imported',name:'Imported event'}];for(const t of trials){if(!state.events.some(e=>e.id===t.eventId))t.eventId=state.events[0].id;}state.trials=trials;state.trial=Math.min(Math.max(0,Number(input.trial)||0),trials.length-1);state.day=Math.min(Math.max(0,Number(input.day)||0),currentTrial().days.length-1);state.selected=String(input.selected||'');switchDay();state.tab='admin';state.adminSection='overview';state.showFullRoster=false;render();}
function setupAction(action,i){if(state.role!=='admin')return;const val=id=>document.getElementById(id)?.value?.trim()||'';const s=state.searches[i];try{if(action==='renameEvent'){const name=val('editEventName');if(!name)throw Error('Enter an event name.');currentEvent().name=name;}
else if(action==='addEvent'){const name=val('newEventName');if(!name)throw Error('Enter an event name.');const id='event'+(Date.now())+'-'+state.events.length;state.events.push({id,name});state.trials.push({name:'Trial 1',eventId:id,days:[blankDay(currentDay().date,'Day 1')]});state.trial=state.trials.length-1;state.day=0;switchDay();}
else if(action==='renameTrial'){if(!val('editTrialName'))throw Error('Enter a trial name.');currentTrial().name=val('editTrialName');}
else if(action==='addTrial'){const name=val('newTrialName');if(!name)throw Error('Enter the new trial name.');state.trials.push({name,eventId:currentEvent().id,days:[blankDay(currentDay().date,'Day 1')]});state.trial=state.trials.length-1;state.day=0;switchDay();}
else if(action==='renameDay'){if(!val('editDayName'))throw Error('Enter a day label.');currentDay().label=val('editDayName');const date=val('editDayDate')||currentDay().date;if(currentTrial().days.some(d=>d!==currentDay()&&d.date===date))throw Error('That trial already has a day on this date.');currentDay().date=date;}
else if(action==='addDay'){const date=val('newDayDate')||currentDay().date;if(currentTrial().days.some(x=>x.date===date))throw Error('This trial already has a day on that date.');currentTrial().days.push(blankDay(date,`Day ${currentTrial().days.length+1}`));state.day=currentTrial().days.length-1;switchDay();}
else if(action==='addSearch'){if(state.searches.length>=20)throw Error('Maximum 20 searches per day.');state.searches.push(search('New search',roster[0]?.id||'1',4,false));}
else if(action==='deckMinus'||action==='deckPlus'){s.count=Math.max(1,Math.min(10,s.count+(action==='deckPlus'?1:-1)));}
else if(action==='toggleActive'){s.active=!s.active;log(`${s.name}: ${s.active?'activated':'deactivated'}`);}
else if(action==='saveSearch'){const name=val('searchName-'+i);if(!name)throw Error('Enter a search name.');const startId=val('searchStart-'+i);if(startId!==s.startId&&!(confirm(`Change the starting dog for ${s.name}? All dispatch history for this search will reset.`)))return;const count=Number(document.getElementById('searchCount-'+i)?.value??s.count);if(!Number.isInteger(count)||count<1||count>10)throw Error('On-deck dogs must be from 1 to 10.');const enabled=document.getElementById('searchActive-'+i)?.value!=='inactive';s.name=name;s.count=count;if(s.active!==enabled){s.active=enabled;log(`${s.name}: ${enabled?'activated':'deactivated'}`);}if(startId!==s.startId){s.startId=startId;s.queue=startQueue(startId);s.sent=[];s.dropped=[];s.log=[];log(`${s.name}: starting dog set to ${plain(startId)}; queue reset`);} }
else if(action==='resetSearch'){if(!confirm(`Reset the dispatch queue for ${s.name}?`))return;s.queue=startQueue(s.startId);s.sent=[];s.dropped=[];s.log=[];log(`${s.name}: queue reset`);}
else if(action==='removeSearch'){if(!confirm(`Remove search ${s.name} from this demo day?`))return;state.searches.splice(i,1);}
else if(action==='addTeam'){const num=Number(val('addRun')),dog=val('addDog'),handler=val('addHandler');if(!Number.isInteger(num)||num<1||num>99999||!dog)throw Error('Enter a valid run number and dog name.');if(roster.some(d=>d.num===num))throw Error('That run number is already used.');applyRoster([...roster,{id:String(num),num,dog,handler}]);return;}
else if(action==='importPaste'){applyRoster(parseRosterText(val('rosterPaste')));return;}
else if(action==='export'){exportSetup();return;}
render();}catch(e){alert(e.message);}}

function aboutView(){return `<div class="helpgrid"><section class="panel"><h2>What the recipient can try</h2><p style="margin-top:10px">1. Open <b>My dog + SMS</b> and select a sample competitor.</p><p style="margin-top:9px">2. Press <b>Text STATUS</b> to see an automatic reply covering each active search.</p><p style="margin-top:9px">3. Open <b>Running board</b> and dispatch or skip dogs (1 position by default); switch back to see alerts and changing positions.</p><p style="margin-top:9px">4. Choose <b>Admin</b> in the mode switcher, then open <b>Admin → Trial setup</b> to create trials and days, import a CSV roster, edit search starts and on-deck counts.</p><p style="margin-top:9px">5. Set a <b>Weather hold</b> under Admin to simulate an alert. Test STOP and START.</p><div class="steps"><button class="primary" data-tab="admin">Open Admin</button><button data-tab="board">Try dispatching</button></div></section><section class="panel"><h2>What's real—and what isn't</h2><p class="small muted" style="margin-top:10px"><b>Real in this file:</b> locally editable event/trial/day/search setup, CSV roster import, queue logic, independent search orders, position calculations, simulated SMS commands and generated alerts, weather holds, skip/move/drop/restore actions.</p><p class="small muted" style="margin-top:11px"><b>Not connected:</b> Bluehost hosting, real SMS, carrier coverage, authentication, shared database, cross-device synchronization, billing and delivery receipts.</p><p class="small muted" style="margin-top:11px">This is one HTML file. It works offline. Changes are in memory unless you export and restore a JSON backup. The fictional roster is included for demonstration only.</p></section></div>`;}

// v4: focused administration pages. All actions remain in the administrator role.
const adminSections=[
 ['overview','Overview'],['events','Event & trials'],['roster','Running order'],
 ['searches','Searches'],['backup','Backup & reset']
];
function adminNavigation(){
 return `<nav class="admin-pages" aria-label="Administrator pages">${adminSections.map(([id,name])=>
 `<button type="button" data-admin-section="${id}" class="${state.adminSection===id?'selected':''}" aria-current="${state.adminSection===id?'page':'false'}">${name}</button>`).join('')}</nav>`;
}
function adminOverviewV4(){
 const searches=state.searches;
 const totalSent=searches.reduce((n,s)=>n+s.sent.length,0);
 const open=searches.reduce((n,s)=>n+s.queue.length,0);
 const active=searches.filter(s=>s.active).length;
 return `<div class="admin-overview">
  <section class="panel admin-primary">
    <div class="sectionhead"><div><h3>Day status</h3><p>${escapeHTML(currentTrial().name)} · ${escapeHTML(currentDay().date)}</p></div></div>
    <div class="admin-summary">
      <div class="metricbox"><strong>${active}<span> / ${searches.length}</span></strong><small>Active searches</small></div>
      <div class="metricbox"><strong>${open}</strong><small>Queued positions across searches</small></div>
      <div class="metricbox"><strong>${totalSent}</strong><small>Dispatches recorded</small></div>
    </div>
    <div class="admin-hold ${state.hold?'is-hold':''}"><div><strong>${state.hold?'Weather hold active':'Dispatch is enabled'}</strong><p>${state.hold?'All searches are paused; queues are unchanged.':'Gate stewards may dispatch dogs on active searches.'}</p></div>
      <button type="button" class="${state.hold?'primary':'warn'}" data-action="${state.hold?'resume':'hold'}">${state.hold?'Lift weather hold':'Set weather hold'}</button></div>
    <div class="admin-quick"><button class="primary" data-tab="board">Open running board</button><button data-admin-section="searches">Manage searches</button><button data-admin-section="roster">View running order</button></div>
  </section>
  <section class="panel"><h3>Recent activity</h3><p class="muted small admin-intro">Updates in this browser for this trial day.</p>
   <div class="log" aria-live="polite">${state.activity.length?state.activity.slice(0,12).map(x=>`<div class="logentry"><small>${escapeHTML(x.at)}</small><div>${escapeHTML(x.text)}</div></div>`).join(''):'<p class="small muted">No activity recorded for this day.</p>'}</div>
  </section></div>
  ${scheduleAdminView()}
  <p class="admin-footnote">Offline demo only. SMS messages, security, and shared synchronization are not connected to real services.</p>`;
}
function adminEventsV4(){const d=currentDay(),t=currentTrial(),e=currentEvent();return `
 <div class="admin-dual">
  <section class="panel"><div class="sectionhead"><div><h3>1. Event</h3><p>Group related trials under one event.</p></div></div>
   <div class="settings-col"><div class="formrow"><div><label for="editEventName">Event name</label><input id="editEventName" value="${escapeHTML(e.name)}" maxlength="100"></div><button data-setup="renameEvent" class="primary">Save name</button></div>
   <div class="admin-divider"></div><div class="formrow"><div><label for="newEventName">New event</label><input id="newEventName" placeholder="Event name" maxlength="100"></div><button data-setup="addEvent">Create event</button></div></div>
  </section>
  <section class="panel"><div class="sectionhead"><div><h3>2. Trial</h3><p>Each event can contain multiple trials, including on the same date.</p></div></div>
   <div class="settings-col"><div class="formrow"><div><label for="editTrialName">Trial name</label><input id="editTrialName" value="${escapeHTML(t.name)}" maxlength="100"></div><button data-setup="renameTrial" class="primary">Save name</button></div>
   <div class="admin-divider"></div><div class="formrow"><div><label for="newTrialName">New trial in this event</label><input id="newTrialName" placeholder="Trial name" maxlength="100"></div><button data-setup="addTrial">Create trial</button></div></div>
  </section>
  <section class="panel"><div class="sectionhead"><div><h3>3. Trial day</h3><p>Every trial day has its own running order, searches and progress.</p></div></div>
   <div class="settings-col"><div class="admin-date-fields"><div><label for="editDayName">Day label</label><input id="editDayName" value="${escapeHTML(d.label)}" maxlength="100"></div><div><label for="editDayDate">Date</label><input type="date" id="editDayDate" value="${escapeHTML(d.date)}"></div></div>
   <button data-setup="renameDay" class="primary admin-align">Save day details</button><div class="admin-divider"></div>
   <div class="formrow"><div><label for="newDayDate">Add another day to this trial</label><input id="newDayDate" type="date" value="${escapeHTML(d.date)}"></div><button data-setup="addDay">Add trial day</button></div></div>
  </section>
 </div><p class="admin-footnote">Use the Event, Calendar date and Trial selectors above to switch contexts. Changes to one trial day do not change another.</p>`;}
function adminRosterV4(){const count=roster.length,rows=state.showFullRoster?roster:roster.slice(0,12);return `
 <section class="panel"><div class="sectionhead"><div><h3>Running order <span class="admin-count">${count} teams</span></h3><p>Master order for ${escapeHTML(currentDay().date)} · ${escapeHTML(currentTrial().name)}</p></div></div>
  <div class="roster-table-wrap"><table class="roster-table"><thead><tr><th scope="col">Run #</th><th scope="col">Dog</th><th scope="col">Handler</th></tr></thead><tbody>${rows.map(x=>`<tr><td>#${x.num}</td><td>${escapeHTML(x.dog)}</td><td>${escapeHTML(x.handler)}</td></tr>`).join('')}</tbody></table></div>
  ${count>12?`<button class="admin-more" data-admin-roster="toggle">${state.showFullRoster?'Show fewer teams':`Show all ${count} teams`}</button>`:''}
 </section>
 <div class="admin-dual admin-block-gap">
 <section class="panel"><h3>Import a running order</h3><p class="muted small admin-intro">Paste spreadsheet rows or select a CSV/TSV file. Columns: run number, dog, handler. Importing replaces this day’s roster and resets search dispatch history.</p>
 <label for="rosterPaste">Roster rows</label><textarea id="rosterPaste" rows="5" placeholder="Run,Dog,Handler\n1,Atlas,Morgan\n2,Fern,Lee"></textarea>
 <div class="admin-quick"><button data-setup="importPaste" class="primary">Import pasted rows</button><label for="rosterFile" class="filelabel">Choose CSV/TSV</label><input id="rosterFile" class="hidden-file" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values"></div>
 <p class="muted small admin-intro">Excel files must be saved as CSV first. No file is uploaded to a server.</p></section>
 <section class="panel"><h3>Add one team</h3><p class="muted small admin-intro">Adding a team also rebuilds the day’s queues. Confirm before applying.</p>
 <div class="settings-col"><div class="admin-add-team"><div><label for="addRun">Run #</label><input type="number" id="addRun" min="1" max="99999" value="${Math.max(0,...roster.map(x=>x.num))+1}"></div><div><label for="addDog">Dog</label><input id="addDog" maxlength="100" placeholder="Name"></div><div><label for="addHandler">Handler</label><input id="addHandler" maxlength="100" placeholder="Name"></div></div><button data-setup="addTeam" class="primary admin-align">Add team to order</button></div></section>
 </div>`;}
function adminSearchesV4(){return `<section class="panel"><div class="sectionhead"><div><h3>Search configuration <span class="admin-count">${state.searches.length} searches</span></h3><p>Changes apply only to ${escapeHTML(currentTrial().name)} on ${escapeHTML(currentDay().date)}.</p></div><button data-setup="addSearch" class="primary">Add search</button></div>
 <p class="muted small admin-intro">Set the starting dog, on-deck group size and whether each search is active. Changing a starting dog resets that search’s queue after confirmation.</p>
 <div class="admin-search-grid">${state.searches.map((s,i)=>`<article class="admin-search-card">
 <div class="admin-search-heading"><h3>Search ${i+1}</h3><span class="admin-status ${s.active?'is-active':''}">${s.active?'Active':'Inactive'}</span></div>
 <p class="muted small">${s.sent.length} sent · ${s.queue.length} waiting · ${s.dropped.length} dropped</p>
 <div class="admin-search-fields"><div><label for="searchName-${i}">Search name</label><input id="searchName-${i}" maxlength="100" value="${escapeHTML(s.name)}"></div>
 <div><label for="searchStart-${i}">Starting dog</label><select id="searchStart-${i}">${options(s.startId||s.queue[0]||roster[0]?.id)}</select></div>
 <div><label for="searchCount-${i}">On-deck dogs (1–10)</label><input id="searchCount-${i}" type="number" min="1" max="10" inputmode="numeric" value="${s.count}"></div>
 <div><label for="searchActive-${i}">Search status</label><select id="searchActive-${i}"><option value="active" ${s.active?'selected':''}>Active</option><option value="inactive" ${!s.active?'selected':''}>Inactive</option></select></div></div>
 <div class="admin-search-actions"><button data-setup="saveSearch" data-idx="${i}" class="primary">Save search</button><div class="admin-low-actions"><button data-setup="resetSearch" data-idx="${i}" class="soft">Reset queue</button><button data-setup="removeSearch" data-idx="${i}" class="danger-light">Remove search</button></div></div>
 </article>`).join('')||'<p class="muted">No searches configured. Select Add search.</p>'}</div></section>`;}
function adminBackupV4(){return `<div class="admin-dual">
 <section class="panel"><h3>Save & restore</h3><p class="muted small admin-intro">This offline demo does not save automatically after the page is closed. Export a JSON backup to preserve all events, trials, day settings, running orders and progress.</p>
 <div class="settings-col"><button data-setup="export" class="primary admin-align">Download JSON backup</button><label for="backupFile" class="filelabel admin-align">Restore a JSON backup</label><input id="backupFile" class="hidden-file" type="file" accept="application/json,.json"></div>
 <p class="muted small admin-intro">Restoring replaces all current local demo data. Only open backups you trust.</p></section>
 <section class="panel"><h3>Reset selected day</h3><p class="muted small admin-intro">Clears all dispatch progress, weather hold and simulated messages for the selected trial day. The trial setup and roster remain.</p>
 <p class="admin-selected"><strong>${escapeHTML(currentTrial().name)}</strong><span>${escapeHTML(currentDay().date)} · ${escapeHTML(currentDay().label)}</span></p>
 <button data-action="reset" class="danger-light admin-align">Reset day queues & messages</button></section>
 </div>`;}
function adminShellV4(){
 const selected=adminSections.some(x=>x[0]===state.adminSection)?state.adminSection:'overview';
 const desc={overview:'Today’s controls and status',events:'Manage events, trials and calendar days',roster:'View and import the master running order',searches:'Configure each search for this trial day',backup:'Export, restore or reset demo data'};
 return `<div class="admin-header"><div><span class="eyebrow">Administrator</span><h2>${adminSections.find(x=>x[0]===selected)[1]}</h2><p>${desc[selected]}</p></div><span class="admin-context">${escapeHTML(currentDay().date)}</span></div>`+
 adminNavigation()+
 (selected==='overview'?adminOverviewV4():selected==='events'?adminEventsV4():selected==='roster'?adminRosterV4():selected==='searches'?adminSearchesV4():adminBackupV4());
}

function render(){if(state.role!=='admin'&&(state.tab==='admin'||state.tab==='setup'))state.tab='dog';document.body.dataset.theme=state.theme;const d=byId(state.selected);app.innerHTML=`<div class="hero"><div><div class="eyebrow">Nose work field operations · interactive prototype</div><h1>${state.role==='admin'?'Trial operations':'One connected admin. Everyone informed.'}</h1><p>${state.role==='admin'?'Configure trials and manage the running board.':'Mobile-first running board with simulated SMS for competitors without data access.'}</p></div><div class="status-pill ${state.hold?'hold':''}"><span class="dot"></span>${state.hold?'Weather hold':'Trial running · demo'}</div></div><div class="notice"><strong>Offline prototype — no live SMS or shared data.</strong> Each trial-day is independent. Admin setup is a role-restricted preview, not real security.</div>${roleSwitcher()}${trialBar()}<nav class="mainnav" aria-label="Demo sections"><button data-tab="dog" class="${state.tab==='dog'?'active':''}">My dog + SMS</button><button data-tab="board" class="${state.tab==='board'?'active':''}">Running board</button>${state.role==='admin'?`<button data-tab="admin" class="${['admin','setup'].includes(state.tab)?'active':''}">Admin</button>`:''}<button data-tab="about" class="${state.tab==='about'?'active':''}">Help</button></nav>${state.tab==='dog'?dogView():state.tab==='board'?boardView():['admin','setup'].includes(state.tab)?adminShellV4():aboutView()}<div class="footer">Offline demo · ${escapeHTML(currentEvent().name)} · ${escapeHTML(dayTitle())} · ${d?'dog: '+escapeHTML(d.dog):'no dog'} · role: ${escapeHTML(state.role)} · no WordPress</div>`;const c=document.getElementById('smsMessages');if(c)c.scrollTop=c.scrollHeight;}
app.addEventListener('change',e=>{const el=e.target;if(el.id==='roleSelect'){state.role=el.value;state.tab=state.role==='admin'?'admin':state.role==='steward'?'board':'dog';render();return;}if(el.id==='themeSelect'){state.theme=el.value==='outdoor'?'outdoor':'indoor';render();return;}if(el.id==='eventSelect'){const inds=eventTrialIndices(el.value);if(inds.length)selectTrialDay(inds[0],state.trials[inds[0]].days[0].date);render();return;}if(el.id==='dateSelect'){const inds=trialsOnDate(currentEvent().id,el.value);if(inds.length)selectTrialDay(inds[0],el.value);render();return;}if(el.id==='trialSelect'){const index=Number(el.value);if(state.trials[index])selectTrialDay(index,currentDay().date);render();return;}if(el.id==='watchDog'){state.selected=el.value;ensureInbox(state.selected);render();return;}if(el.id==='optin'){state.subscribed[el.checked?'add':'delete'](state.selected);log(`${plain(state.selected)} ${el.checked?'subscribed':'unsubscribed'} via local checkbox`);if(el.checked)mockNotify(state.selected,`Alerts enabled for ${byId(state.selected).dog}. Reply STATUS for positions.`);render();return;}if(el.id==='rosterFile'&&el.files?.[0]&&state.role==='admin'){const r=new FileReader();r.onload=()=>{try{applyRoster(parseRosterText(r.result));}catch(err){alert(err.message);}};r.readAsText(el.files[0]);return;}if(el.id==='backupFile'&&el.files?.[0]&&state.role==='admin'){const r=new FileReader();r.onload=()=>{try{importSetup(r.result);}catch(err){alert(err.message);}};r.readAsText(el.files[0]);}});
app.addEventListener('submit',e=>{if(e.target.id!=='smsForm')return;e.preventDefault();const input=document.getElementById('smsInput');receiveSMS(input?.value||'');render();});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.adminSection){if(state.role!=='admin')return;state.tab='admin';state.adminSection=b.dataset.adminSection;render();return;}if(b.dataset.adminRoster){if(state.role!=='admin')return;state.showFullRoster=!state.showFullRoster;render();return;}if(b.dataset.role){state.role=b.dataset.role;state.tab=state.role==='admin'?'admin':state.role==='steward'?'board':'dog';if(state.role==='admin')state.adminSection='overview';render();return;}if(b.dataset.tab){if(['admin','setup'].includes(b.dataset.tab)&&state.role!=='admin')return;state.tab=b.dataset.tab;if(state.tab==='admin')state.adminSection='overview';if(state.tab==='setup')state.adminSection='events';render();return;}if(b.dataset.jump&&state.role==='admin'){const [ti,di]=b.dataset.jump.split(':').map(Number);if(state.trials[ti]?.days[di]){state.trial=ti;state.day=di;switchDay();render();}return;}if(b.dataset.setup){setupAction(b.dataset.setup,Number(b.dataset.idx));return;}if(b.dataset.sms){receiveSMS(b.dataset.sms);render();return;}if(b.dataset.expand!==undefined){if(state.role==='viewer')return;const i=Number(b.dataset.expand);state.showExtra[i]=!state.showExtra[i];render();return;}if(b.dataset.do){if(state.role==='viewer')return;const i=Number(b.dataset.idx),s=state.searches[i],action=b.dataset.do;const id=action==='restore'?document.getElementById('restore-'+i)?.value:document.getElementById('extra-'+i)?.value;const anchor=document.getElementById('anchor-'+i)?.value;const skipCount=action==='skip'?document.getElementById('skip-count-'+i)?.value:1;dispatch(s,action,id,anchor,skipCount);render();return;}if(b.dataset.action==='hold'){if(state.role!=='admin')return;changeHold(true);render();return;}if(b.dataset.action==='resume'){if(state.role!=='admin')return;changeHold(false);render();return;}if(b.dataset.action==='fast'){if(state.role==='viewer')return;const s=state.searches.find(s=>s.active);if(s)for(let i=0;i<3;i++)dispatch(s,'send');render();return;}if(b.dataset.action==='reset'){if(state.role!=='admin')return;if(!confirm('Reset queues, mock messages, and weather hold for this selected day? Trial setup and roster will be kept.'))return;for(const s of state.searches){s.queue=startQueue(s.startId||roster[0]?.id);s.sent=[];s.dropped=[];s.log=[];}state.hold=false;state.subscribed=new Set(state.selected?[state.selected]:[]);state.inboxes={};state.activity=[];state.showExtra={};if(state.selected)ensureInbox(state.selected);log('Administrator reset current day queues and demo messages');render();}});
render();
</script>
</body>
</html>
